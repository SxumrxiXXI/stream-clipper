# The whole pipeline, once a day: find moments, make clips, schedule the posts,
# pull views. The owner's settings, the posting queue and the detailed logs live
# in a separate private repository; nothing about individual clips is printed
# here, because this log is public.
name: daily

on:
  # GitHub's timer is best-effort: a start can be late or skipped outright. So
  # there are three chances a day. The first one that runs does the work; a later
  # one finds the day already done and stops in seconds. If the first one ended
  # with problems, the next one tries again.
  schedule:
    - cron: "17 7 * * *"          # 09:17 in Cairo (winter time)
    - cron: "47 8 * * *"          # 10:47
    - cron: "17 10 * * *"         # 12:17
    # Rounds: a short run that makes one clip from the last few hours for the next
    # posting slot. Two chances each; outside the dates in the private settings
    # (rounds_start / rounds_until) these stop in seconds.
    - cron: "45 13 * * *"         # 15:45 in Cairo, for the 18:00 slot
    - cron: "15 14 * * *"         # 16:15
    - cron: "45 17 * * *"         # 19:45, for the 22:00 slot
    - cron: "15 18 * * *"         # 20:15
  workflow_dispatch:
    inputs:
      round:
        description: "A short round (one clip from the last few hours) instead of the daily run"
        type: boolean
        default: false
      dry_run:
        description: "Make and plan clips but send nothing"
        type: boolean
        default: true
      force:
        description: "Run even if today's run already finished"
        type: boolean
        default: false
      clips:
        description: "How many clips to make (blank: the number in the settings)"
        default: ""
      state_branch:
        description: "Branch of the private repository to save the records to"
        default: "main"
      pretend_date:
        description: "Rehearse the featured-game schedule as if it were this date, YYYY-MM-DD (only with dry_run)"
        default: ""
      pretend_game:
        description: "Rehearse the featured-game schedule with this game instead, exact Twitch category name (only with dry_run)"
        default: ""
      simulate:
        description: "Fault to rehearse (only with dry_run)"
        type: choice
        options: ["none", "bad_gemini_key"]
        default: "none"

permissions:
  contents: read
  actions: write        # only to re-enable this workflow's own schedule (last step)

concurrency:
  group: daily
  cancel-in-progress: false

env:
  TZ: Africa/Cairo
  ROUND_ASKED: ${{ inputs.round && '1' || '' }}
  OPENSHORTS_COMMIT: 8af4a48a2bdda96c9a02bb8df3f09d4e7ec99e0f
  OPENSHORTS_SERVICES: backend

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Private settings and records
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-private
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: private

      - name: Already done today?
        id: guard
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          PRETEND: ${{ inputs.dry_run && inputs.pretend_date || '' }}
        run: |
          log="private/data/logs/daily-$(date +%F).log"
          # What kind of run is this? A start by hand, by the backup or by the
          # Google trigger says so itself. A start by GitHub's own timer is judged
          # by the clock, not by which timer fired: GitHub has fired a morning
          # timer seven hours late. Before 07:00 nothing runs; from 15:00 on it is
          # a round if the day's run is done, and the day's run if it is not.
          ROUND="$ROUND_ASKED"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            hour=$((10#$(date +%H)))
            if [ "$hour" -lt 7 ]; then
              echo "done=true" >> "$GITHUB_OUTPUT"
              echo "a timer fired at night; nothing to do"
              exit 0
            fi
            if [ "$hour" -ge 15 ] && grep -qx "daily run finished" "$log" 2> /dev/null; then ROUND=1; fi
          fi
          echo "round=$ROUND" >> "$GITHUB_OUTPUT"
          if [ -n "$ROUND" ]; then
            # A round runs only between the two dates in the private settings, and
            # not within two and a half hours of a round that finished cleanly.
            today="${PRETEND:-$(date +%F)}"
            start=$(sed -n 's/^rounds_start: *"\{0,1\}\([0-9-]*\).*/\1/p' private/config/posting.yaml)
            until=$(sed -n 's/^rounds_until: *"\{0,1\}\([0-9-]*\).*/\1/p' private/config/posting.yaml)
            last=$(sed -n 's/^round finished \([0-9T:-]*\)$/\1/p' "$log" 2> /dev/null | tail -1)
            if [ -n "$FORCE" ]; then
              :
            elif [ -z "$start" ] || [[ "$today" < "$start" ]] || [[ "$today" > "${until:-$start}" ]]; then
              echo "done=true" >> "$GITHUB_OUTPUT"
              echo "rounds are not switched on for today; nothing to do"
            elif [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 9000 ]; then
              echo "done=true" >> "$GITHUB_OUTPUT"
              echo "a round finished a short while ago; nothing to do"
            fi
          elif [ -z "$FORCE" ] && grep -qx "daily run finished" "$log" 2> /dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "today's run already finished; nothing to do"
          fi

      - name: Link them into place
        if: steps.guard.outputs.done != 'true'
        run: |
          ln -s private/config config
          ln -s private/data data
          mkdir -p data/logs

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != 'true'
        with:
          python-version: "3.11"

      - name: Tools
        if: steps.guard.outputs.done != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip > /dev/null
          pip install -q -r requirements.txt yt-dlp
          mkdir -p tools
          curl -sSL -o /tmp/tdl.zip https://github.com/lay295/TwitchDownloader/releases/download/1.56.5/TwitchDownloaderCLI-1.56.5-Linux-x64.zip
          echo "f2bcee00d0e6da759d97c23767345634cb9cdb10cdff96cfa96f97983d51bf55  /tmp/tdl.zip" | sha256sum -c -
          unzip -q -o /tmp/tdl.zip TwitchDownloaderCLI -d tools && chmod +x tools/TwitchDownloaderCLI

      - name: OpenShorts
        if: steps.guard.outputs.done != 'true'
        run: |
          git clone -q https://github.com/mutonby/openshorts.git vendor/openshorts
          git -C vendor/openshorts checkout -q "$OPENSHORTS_COMMIT"
          cp deploy/openshorts.override.yml vendor/openshorts/docker-compose.override.yml
          cd vendor/openshorts
          # The container runs as its own user and writes into this checkout.
          mkdir -p uploads output && chmod -R a+rwX .
          docker compose build backend > /tmp/build.log 2>&1 || { tail -40 /tmp/build.log; exit 1; }
          docker compose up -d --no-build backend

      - name: Keys
        if: steps.guard.outputs.done != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SIMULATE: ${{ inputs.dry_run && inputs.simulate || 'none' }}
        run: |
          umask 077
          if [ "$SIMULATE" = bad_gemini_key ]; then
            echo "rehearsal: running with a Gemini key that does not work"
            GEMINI_API_KEY="not-a-real-key-rehearsal"
          fi
          printf 'GEMINI_API_KEY=%s\nUPLOAD_POST_API_KEY=%s\nTWITCH_CLIENT_ID=%s\nTWITCH_CLIENT_SECRET=%s\n' \
            "$GEMINI_API_KEY" "$UPLOAD_POST_API_KEY" "$TWITCH_CLIENT_ID" "$TWITCH_CLIENT_SECRET" > .env
          test -n "$GEMINI_API_KEY" || { echo "the keys are not set in this repository's secrets"; exit 1; }

      - name: Daily run
        if: steps.guard.outputs.done != 'true'
        env:
          CLIP_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
          CLIP_PRETEND_DATE: ${{ inputs.dry_run && inputs.pretend_date || '' }}
          CLIP_PRETEND_GAME: ${{ inputs.dry_run && inputs.pretend_game || '' }}
          FORCE: ${{ inputs.force && '1' || '' }}
          CLIPS: ${{ inputs.clips }}
          ROUND: ${{ steps.guard.outputs.round }}
        run: |
          args=(--quiet)
          [ -n "$ROUND" ] && args+=(--round)
          [ -n "$FORCE" ] && args+=(--force)
          [[ "$CLIPS" =~ ^[0-9]+$ ]] && args+=(--clips "$CLIPS")
          [ -n "$CLIP_DRY_RUN" ] && echo "trial: nothing will be sent to any platform"
          python src/daily.py "${args[@]}"

      - name: Save the records
        if: always() && steps.guard.outputs.done != 'true'
        env:
          STATE_BRANCH: ${{ inputs.state_branch || 'main' }}
          ROUND: ${{ steps.guard.outputs.round }}
        run: |
          [[ "$STATE_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad branch name"; exit 1; }
          cd private
          git config user.name "stream-clipper daily run"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new to save"; exit 0; fi
          if [ -n "$ROUND" ]; then what="Round"; else what="Daily run"; fi
          git commit -q -m "$what $(date +%F)"
          if [ "$STATE_BRANCH" = main ]; then
            # Keep anything the owner pushed while this run was going.
            git pull -q --rebase origin main
            git push -q origin HEAD:main 2> /dev/null
          else
            git push -q --force origin "HEAD:refs/heads/${STATE_BRANCH}" 2> /dev/null
          fi
          echo "records saved to the private repository (${STATE_BRANCH})"

      # GitHub switches a schedule off after 60 days without activity in the
      # repository. Re-enabling it on every run keeps the daily run alive.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable daily.yml -R "$GITHUB_REPOSITORY" || true
          gh workflow enable check.yml -R "$GITHUB_REPOSITORY" || true
