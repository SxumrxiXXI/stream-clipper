# Live posting: through the hours listed in the private settings (live_hours),
# make a clip from a stream of the featured game that is live right now and post
# it at the top of each hour (src/live.py). A run works for up to five hours and
# starts the next one itself while there is another hour to do that night.
#
# To stop it: set `live: false` in the private settings (it stops before the
# next hour and does not start again), or disable this workflow.
#
# Nothing about individual clips or streamers is printed here, because this log
# is public: only the posting times worked on and whether a clip was placed.
name: live

on:
  # GitHub's timer is best-effort, so the night's first run gets four chances
  # and there is a net every two hours in case the chain of runs breaks. A start
  # with no posting time coming up ends in seconds; a start while a run is going
  # waits for it to finish. (Times in UTC; Cairo is two hours ahead in winter.)
  schedule:
    - cron: "53 21 * * *"         # 23:53 in Cairo
    - cron: "8 22 * * *"          # 00:08
    - cron: "23 22 * * *"         # 00:23
    - cron: "38 22 * * *"         # 00:38
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Judge and make clips but post nothing"
        type: boolean
        default: true
      hours:
        description: "How long this run works (at most 5)"
        default: "5"
      chain:
        description: "Start the next run when this one ends (real runs only)"
        type: boolean
        default: false
      force:
        description: "Trial: treat every full hour as a live hour, whatever the settings say"
        type: boolean
        default: false
      state_branch:
        description: "Branch of the private repository to save the records to"
        default: "main"

permissions:
  contents: read
  actions: write        # to start the next run of this workflow

# One watcher at a time. It does not share the daily run's group: it runs for
# hours and must not hold the daily run or the post checks back. Records are
# merged when saved (deploy/save_state.sh).
concurrency:
  group: live
  cancel-in-progress: false

env:
  TZ: Africa/Cairo
  OPENSHORTS_COMMIT: 8af4a48a2bdda96c9a02bb8df3f09d4e7ec99e0f
  OPENSHORTS_SERVICES: backend
  STATE_BRANCH: ${{ inputs.state_branch || 'main' }}
  STATE_AUTHOR: stream-clipper live posting
  DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
  FORCE: ${{ inputs.force && '1' || '' }}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - name: Private settings and records
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-private
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: private

      - name: Anything to do?
        id: guard
        run: |
          # work: a posting time is coming up. idle: live posting is on but the next
          # posting time is hours away, so only wait and start the next run. none:
          # switched off. (deploy/live_guard.py explains why idle runs exist.)
          if [ -n "$FORCE" ]; then echo "mode=work" >> "$GITHUB_OUTPUT"; echo "a trial, started by hand"; exit 0; fi
          python3 deploy/live_guard.py | tee -a "$GITHUB_OUTPUT"

      - name: Wait for the night
        if: steps.guard.outputs.mode == 'idle'
        env:
          SECONDS_TO_WAIT: ${{ steps.guard.outputs.seconds }}
        run: |
          [[ "$SECONDS_TO_WAIT" =~ ^[0-9]+$ ]] || SECONDS_TO_WAIT=60
          echo "waiting $((SECONDS_TO_WAIT / 60)) minutes; nothing is set up or posted by this run"
          sleep "$SECONDS_TO_WAIT"

      - name: Link them into place
        if: steps.guard.outputs.mode == 'work'
        run: |
          ln -s private/config config
          ln -s private/data data
          mkdir -p data/logs

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.mode == 'work'
        with:
          python-version: "3.11"

      - name: Tools
        if: steps.guard.outputs.mode == 'work'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip > /dev/null
          pip install -q -r requirements.txt yt-dlp
          mkdir -p tools
          curl -sSL -o /tmp/tdl.zip https://github.com/lay295/TwitchDownloader/releases/download/1.56.5/TwitchDownloaderCLI-1.56.5-Linux-x64.zip
          echo "f2bcee00d0e6da759d97c23767345634cb9cdb10cdff96cfa96f97983d51bf55  /tmp/tdl.zip" | sha256sum -c -
          unzip -q -o /tmp/tdl.zip TwitchDownloaderCLI -d tools && chmod +x tools/TwitchDownloaderCLI

      - name: OpenShorts
        if: steps.guard.outputs.mode == 'work'
        run: |
          git clone -q https://github.com/mutonby/openshorts.git vendor/openshorts
          git -C vendor/openshorts checkout -q "$OPENSHORTS_COMMIT"
          cp deploy/openshorts.override.yml vendor/openshorts/docker-compose.override.yml
          cd vendor/openshorts
          mkdir -p uploads output && chmod -R a+rwX .
          docker compose build backend > /tmp/build.log 2>&1 || { tail -40 /tmp/build.log; exit 1; }
          docker compose up -d --no-build backend

      - name: Keys
        if: steps.guard.outputs.mode == 'work'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          umask 077
          printf 'GEMINI_API_KEY=%s\nUPLOAD_POST_API_KEY=%s\nTWITCH_CLIENT_ID=%s\nTWITCH_CLIENT_SECRET=%s\n' \
            "$GEMINI_API_KEY" "$UPLOAD_POST_API_KEY" "$TWITCH_CLIENT_ID" "$TWITCH_CLIENT_SECRET" > .env
          test -n "$GEMINI_API_KEY" || { echo "the keys are not set in this repository's secrets"; exit 1; }

      - name: Live posting
        if: steps.guard.outputs.mode == 'work'
        env:
          HOURS: ${{ inputs.hours || '5' }}
        run: |
          [[ "$HOURS" =~ ^[0-9]+(\.[0-9]+)?$ ]] || HOURS=5
          HOURS=$(python -c "print(min(5.0, max(0.1, float('$HOURS'))))")
          args=(--quiet --hours "$HOURS")
          [ -n "$FORCE" ] && args+=(--force)
          if [ -n "$DRY" ]; then export CLIP_DRY_RUN=1; echo "trial: nothing will be posted"; fi
          # While it runs it saves its records itself, but only to the real branch: a
          # trial's records are saved once, at the end.
          [ "$STATE_BRANCH" = main ] && export LIVE_SYNC="$PWD/deploy/save_state.sh"
          python src/live.py "${args[@]}"

      - name: Save the records
        if: always() && steps.guard.outputs.mode == 'work'
        run: bash deploy/save_state.sh "Live posting $(date '+%F %H:%M')"

      # The next run, if the settings still want one. They are read afresh, so a
      # switch-off the owner pushed while this run was going is seen.
      - name: Start the next run
        if: success() && steps.guard.outputs.mode != 'none' && (github.event_name == 'schedule' || (inputs.chain && !inputs.dry_run))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C private pull -q --rebase origin main 2> /dev/null || true
          mode=$(python3 deploy/live_guard.py | sed -n 's/^mode=//p')
          if [ "$mode" = work ] || [ "$mode" = idle ]; then
            gh workflow run live.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f dry_run=false -f chain=true -f hours=5 -f state_branch=main
            echo "the next run was started"
          else
            echo "switched off, or the last live day is over; not starting another run"
          fi
